# Points d'accès des sources de données. Indépendant du département.

hubeau:
  piezometrie: https://hubeau.eaufrance.fr/api/v1/niveaux_nappes/
  hydrometrie: https://hubeau.eaufrance.fr/api/v2/hydrometrie/
  ecoulement: https://hubeau.eaufrance.fr/api/v1/ecoulement/

geo_api: https://geo.api.gouv.fr/

# Météo-France SIM quotidienne, jeu data.gouv.fr « Données changement climatique - SIM quotidienne »
# Un fichier CSV compressé par année (QUOT_SIM2_<annee>) + QUOT_SIM2_latest (60 jours glissants).
sim:
  api_datagouv: https://www.data.gouv.fr/api/1/
  jeu_datagouv: 6569b27598256cc583c917a7
  crs_grille: "EPSG:27572"    # Lambert II étendu
  unite_coordonnees_m: 100    # LAMBX / LAMBY en hectomètres
  pas_grille_m: 8000

http:
  timeout_s: 60
  tentatives: 5          # reprises avec backoff exponentiel (tenacity)
