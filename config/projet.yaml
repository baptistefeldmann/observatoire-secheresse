# Paramètres du projet.
#
# Pour adapter l'observatoire à un autre département, seul le bloc `territoire`
# de ce fichier et le fichier `zones.yaml` sont à modifier (voir README).

territoire:
  code_departement: "85"     # code INSEE, sert de filtre aux API (Hub'Eau, geo.api.gouv.fr)
  nom: "Vendée"
  slug: "vendee"             # minuscules, chiffres et _ : noms de fichiers (ocs_<annee>_<slug>.tif)

# CRS de stockage et de calcul. EPSG:2154 couvre la métropole ; un département
# d'outre-mer nécessite la projection officielle locale (ex. EPSG:2975 pour La Réunion).
crs: "EPSG:2154"

# L'emprise est dérivée du contour départemental (geo.api.gouv.fr), jamais saisie à la main.
emprise:
  tampon_m: 1000

periode_reference:
  hydro_meteo:
    debut: 1991
    fin: 2020
    annees_min: 15           # en deçà, pas d'indice ; entre annees_min et la période complète, avertissement
    annees_min_apres_rupture: 8   # station à rupture confirmée : référence courte admise (D8)
  sentinel2:                 # [V2]
    debut: 2018
    fin: 2025

ingestion:
  fenetre_reingestion_jours: 90   # captation des corrections a posteriori de Hub'Eau
  # Hub'Eau Piézométrie ne donne pas de statut : station « en service » si mesure récente
  piezo_inactif_apres_jours: 365

indices:
  # Identifiant de la dernière décision de méthode en vigueur (docs/methodologie.md), stocké
  # avec chaque indice (`version_methodo`). À changer à chaque nouvelle décision.
  version_methodo: "D9"
  historique_debut: 1991     # première année des indices hebdomadaires (make indices)
  ips:
    # Un piézomètre dont la dernière mesure est plus ancienne n'entre pas dans le
    # composite de la semaine (docs/methodologie.md, D1).
    fraicheur_max_jours: 45
    jours_min_mois: 10           # un mois compte dans la référence s'il a au moins 10 jours (D7)
  debit:
    jours_min_q7: 5              # moyenne sur 7 jours calculée si au moins 5 jours sont renseignés (D7)
    demi_fenetre_jours: 15       # référence : mêmes dates à ±15 jours, sur chaque année (D7)
    part_min_fenetre: 0.5        # une année compte si la moitié au moins de sa fenêtre est renseignée (D7)
  ruptures:
    # Détection à chaque `make reference` (test de Pettitt sur les moyennes annuelles, D8)
    seuil_p: 0.01
    mois_min_annee: 10           # piézométrie : année complète si 10 mois valides
    jours_min_annee: 330         # débits : année complète si 330 jours
  spi:
    # Cumuls glissants de pluie terminés le dimanche de la semaine ISO (SPI 1, 3 et 6 mois)
    fenetres_jours: {spi_1: 30, spi_3: 91, spi_6: 182}

# Job hebdomadaire (`make hebdo`, SPEC §7.1)
hebdo:
  # Publication : données sur le remote DVC, commit des fichiers data/*.dvc et étiquette
  # data-AAAA-Www, poussés sur le remote Git. Pas de commit hors de cette branche.
  branche: main
  remote_git: origin
  # Contrôles de vraisemblance sur les valeurs réingérées (rapport, sans effet sur les données)
  controles:
    pluie_max_mm_jour: 200       # maximum observé par maille SIM sur 1990-2026 : 89 mm
    remplissage_max: 1.05        # volume / capacité d'une retenue ; maximum observé : 1,03

# API (SPEC §8.1) : contours de zones simplifiés pour le web (1,8 Mo en GeoJSON bruts,
# 250 ko à 20 m pour la Vendée, sans différence visible à l'échelle du département)
api:
  simplification_m: 20

# Version publique du dashboard (make pages : site statique sur GitHub Pages)
publication:
  avertissement: >-
    Prototype en cours de validation : l'indice n'a pas encore été confronté aux
    sécheresses passées. Ne pas l'utiliser pour une décision.
  # Sources citées en pied de page (Licence Ouverte : mention obligatoire de la source)
  sources:
    - "Hub'Eau (BRGM, OFB, Schapi) : nappes, débits, écoulement ONDE"
    - "Météo-France : réanalyse SIM (data.gouv.fr)"
    - "SANDRE : masses d'eau souterraine, zones d'alerte"
    - "Département de la Vendée : remplissage des retenues d'eau potable"
    - "IGN : Plan IGN (Géoplateforme)"

# Confrontation des indices aux arrêtés sécheresse (make validation)
validation:
  semaine_debut: 18          # saison comparée : semaines ISO 18 à 44 (mai à octobre)
  semaine_fin: 44

chemins:
  data: data
  rasters: rasters
  rapports: logs/hebdo       # rapports d'exécution du job, non versionnés
  qgis: qgis                 # projet QGIS généré par make qgis, chargé dans PostGIS
  rapport_validation: docs/validation.md   # rapport de make validation, versionné
