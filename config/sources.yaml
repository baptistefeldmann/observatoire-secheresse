# Points d'accès des sources de données. Indépendant du département.

hubeau:
  piezometrie: https://hubeau.eaufrance.fr/api/v1/niveaux_nappes/
  hydrometrie: https://hubeau.eaufrance.fr/api/v2/hydrometrie/
  ecoulement: https://hubeau.eaufrance.fr/api/v1/ecoulement/

geo_api: https://geo.api.gouv.fr/

# Référentiels SANDRE (WFS, GeoJSON) pour le découpage en zones (docs/methodologie.md, D5)
sandre:
  masses_eau:
    wfs: https://services.sandre.eaufrance.fr/geo/sandre
    couche: sa:PolygMasseDEauSouterraine_VEDL2019_FXX   # polygones par horizon
    couche_noms: sa:MasseDEauSouterraine_VEDL2019_FXX   # noms des masses d'eau
    horizon: 1                                          # masse d'eau affleurante
  zones_alerte:
    wfs: https://services.sandre.eaufrance.fr/geo/zas
    couche: sa:ZAS_FXX
    statut: Validé

# Météo-France SIM quotidienne, jeu data.gouv.fr « Données changement climatique - SIM quotidienne »
# Un fichier CSV compressé par année (QUOT_SIM2_<annee>) + QUOT_SIM2_latest (60 jours glissants).
sim:
  api_datagouv: https://www.data.gouv.fr/api/1/
  jeu_datagouv: 6569b27598256cc583c917a7
  crs_grille: "EPSG:27572"    # Lambert II étendu
  unite_coordonnees_m: 100    # LAMBX / LAMBY en hectomètres
  pas_grille_m: 8000

# Arrêtés sécheresse, jeu data.gouv.fr « Donnée Sécheresse - VigiEau » (Licence Ouverte 2.0) :
# historique complet en un CSV, une ligne par arrêté (zones d'alerte et niveaux en listes JSON).
# Sert uniquement à la validation des indices (make validation), hors composite.
vigieau:
  api_datagouv: https://www.data.gouv.fr/api/1/
  jeu_datagouv: 662a5e2cd71b24df5e9a0827
  ressource: Arrêtés

# Remplissage des retenues, couche nationale de la DREAL Bretagne (GéoBretagne, WFS) :
# dernière semaine seulement, archivée chaque semaine par le pipeline (D6).
retenues_national:
  wfs: https://geobretagne.fr/geoserver/dreal_b/wfs
  couche: dreal_b:qry_remplissage_retenues

# [V2] Sentinel-2 L2A via Microsoft Planetary Computer (STAC, assets signés par planetary_computer.sign).
# La collection n'est pas harmonisée : offset BOA de -1000 à retrancher pour la baseline >= 04.00.
sentinel2:
  stac: https://planetarycomputer.microsoft.com/api/stac/v1
  collection: sentinel-2-l2a
  nuages_max_scene_pct: 80
  scl_valides: [4, 5, 6, 7]       # végétation, sol nu, eau, non classé (SPEC §7.3)
  resolution_m: 10
  offset_boa: -1000
  baseline_offset: "04.00"
  facteur_echelle: 10000          # COG en int16 : indice x 10 000

http:
  timeout_s: 60
  tentatives: 5          # reprises avec backoff exponentiel (tenacity)
