[project]
name = "observatoire-secheresse"
version = "0.1.0"
description = "Suivi hebdomadaire de la sécheresse à l'échelle d'un département"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "geopandas>=1.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "shapely>=2.0",
    "pyproj>=3.6",
    "numpy>=2.0",
    "scipy>=1.13",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "dvc>=3.50",
]

[project.optional-dependencies]
# [V2] — installé dès la V0 pour le spike Sentinel-2 (`uv sync --extra raster`)
raster = [
    "xarray>=2024.6",
    "rioxarray>=0.17",
    "rasterio>=1.4",
    "odc-stac>=0.3.10",
    "pystac-client>=0.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF"]
# Caractères typographiques français (’, «, —) légitimes dans les chaînes et commentaires
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["geopandas.*", "shapely.*", "pyproj.*", "scipy.*", "geoalchemy2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
