[project]
name = "observatoire-secheresse"
version = "0.1.0"
description = "Suivi hebdomadaire de la sécheresse à l'échelle d'un département"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
# Dépendances du service web seul (API et dashboard) : c'est ce qu'installe l'image Docker de
# l'API. Les bibliothèques du pipeline de calcul sont dans le groupe `pipeline` (plus bas).
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyproj>=3.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# [V2] — installé dès la V0 pour le spike Sentinel-2 (`uv sync --extra raster`).
# Source : Microsoft Planetary Computer (STAC + URLs signées).
raster = [
    "xarray>=2024.6",
    "rioxarray>=0.17",
    "rasterio>=1.4",
    "odc-stac>=0.3.10",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "dask>=2024.8",
]

[dependency-groups]
# Pipeline de calcul (ingestion, normales, indices, job hebdomadaire) : installé par défaut
# (`default-groups`), exclu de l'image de l'API par `--no-group pipeline`.
pipeline = [
    "geopandas>=1.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "shapely>=2.0",
    "numpy>=2.0",
    "scipy>=1.13",
    "httpx>=0.27",
    "tenacity>=9.0",
    "geoalchemy2>=0.15",
    "alembic>=1.13",
    "dvc>=3.50",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "types-pyyaml",
]

[tool.uv]
default-groups = ["dev", "pipeline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF"]
# Caractères typographiques français (’, «, —) légitimes dans les chaînes et commentaires
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["geopandas.*", "shapely.*", "pyproj.*", "scipy.*", "geoalchemy2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# TestClient de FastAPI : avertissement interne à Starlette, sans effet sur les tests
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
